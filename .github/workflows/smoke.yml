name: Studionet smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - app/src/genlayer/**
      - app/src/ingest/sources/snapshot_source.ts
      - contracts/**
      - database/migrations/**
      - frontend/**
      - workers/api/**
      - workers/site/**
      - wrangler.jsonc
      - wrangler.site.jsonc
      - scripts/validate_quorumx.ts
      - package.json
      - package-lock.json
      - .github/workflows/smoke.yml

permissions:
  contents: read

concurrency:
  group: studionet-smoke
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only live probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUORUMX_GENLAYER_NETWORK: studionet
      QUORUMX_CONTRACT_ADDRESS: "0x59A6A393e15B43b6a13ac6B31A3fbb19094Bf237"
      QUORUMX_SNAPSHOT_SPACES: balancer.eth,safe.eth,arbitrumfoundation.eth,ens.eth
      QUORUMX_DUE_DILIGENCE_V3_CONTRACT_ADDRESS: "0xf183c38364Bc92726E54d3639a6c4f8d107630c7"
      QUORUMX_PROBE_PROPOSAL_KEY: "snapshot:balancer.eth:0x25ee897681ae8bbae5ae224b14ad6a03ea6920f768d52b2e9aa1a85b7eec0590"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe Snapshot and stored Studionet assessment
        run: npm run smoke:studionet
