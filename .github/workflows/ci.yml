name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high

  contract:
    name: Intelligent Contract
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-genlayer-test.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/genvm-linter
          key: genvm-v0.2.16-${{ runner.os }}-${{ runner.arch }}
      - run: python -m pytest contracts/tests -q
      - name: GenVM static safety lint
        run: |
          genvm-lint lint contracts/governance_risk.py --json
          genvm-lint lint contracts/governance_due_diligence.py --json
          genvm-lint lint contracts/governance_due_diligence_v3_3.py --json
      - name: GenVM semantic validation
        run: |
          genvm-lint check contracts/governance_risk.py --json
          genvm-lint check contracts/governance_due_diligence.py --json
          genvm-lint check contracts/governance_due_diligence_v3_3.py --json
      - name: GenLayer Direct Mode evidence-adapter tests
        run: |
          python -m pip install -r requirements-genlayer-test.txt
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p gltest.direct.pytest_plugin contracts/genlayer_runtime_tests -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
